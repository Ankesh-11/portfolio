<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankesh Verma - Portfolio</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>
    <header>
        <h1 id="fullName">Loading...</h1>
        <p id="title"></p>
    </header>
    <div class="container">
        <div class="profile">
            <img id="profileImage" src="images/Ankesh.jpg" alt="Profile Image" />
            <div class="info">
                <h2>About Me</h2>
                <p id="aboutMe"></p>
                <p><strong>Email:</strong> <span id="email"></span></p>
                <p><strong>Phone:</strong> <span id="phone"></span></p>
                <p><strong>Location:</strong> <span id="location"></span></p>
                <p><strong>Bio:</strong> <span id="bio"></span></p>
                <a id="resumeLink" class="resume-link" target="_blank">Download Resume</a>
                <div class="social" id="socialLinks"></div>
            </div>
        </div>

        <div class="skills">
            <h2>Technical Skills</h2>
            <ul id="techSkills"></ul>
        </div>

        <div class="projects">
            <h2>Projects</h2>
            <div id="projectList"></div>
        </div>

        <div class="services">
            <h2>Services</h2>
            <div id="serviceList"></div>
        </div>

        <div class="contact">
            <h2>Contact Me</h2>
            <form id="contactForm">
                <input type="text" name="name" placeholder="Your Name" required />
                <input type="email" name="email" placeholder="Your Email" required />
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
    <script src="mixitup.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
